<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Subscription</title>
    <style>
        /* Yêu cầu 3: Style form bằng CSS Grid layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .newsletter-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        form {
            display: grid;
            grid-template-columns: 150px 1fr; /* Chia 2 cột: Label và Input */
            gap: 20px;
            align-items: center;
        }

        /* Các phần tử chiếm toàn bộ chiều rộng của Grid */
        .full-width {
            grid-column: 1 / -1; 
        }

        .checkbox-group, .radio-group {
            display: flex;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        /* Yêu cầu 4: Hiển thị thông báo thành công */
        #success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="newsletter-container">
        <h2 style="text-align: center; margin-bottom: 20px;">Đăng ký Bản tin</h2>
        
        <div id="success-message">
            🎉 Đăng ký thành công! Cảm ơn bạn.
        </div>

        <form id="newsletter-form">
            <label for="fullname">Họ và Tên:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <div>
                <input type="email" id="email" name="email" required>
                <div id="email-error" class="error">Email không hợp lệ. Hãy kiểm tra lại @ và tên miền.</div>
            </div>

            <label>Loại đăng ký:</label>
            <div class="radio-group">
                <label><input type="radio" name="sub_type" value="monthly" checked> Hàng tháng</label>
                <label><input type="radio" name="sub_type" value="yearly"> Hàng năm</label>
            </div>

            <label>Sở thích:</label>
            <div>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interest" value="tech"> Công nghệ</label>
                    <label><input type="checkbox" name="interest" value="sports"> Thể thao</label>
                    <label><input type="checkbox" name="interest" value="art"> Nghệ thuật</label>
                </div>
                <div id="interest-error" class="error">Vui lòng chọn ít nhất một sở thích.</div>
            </div>

            <div class="full-width" style="text-align: center; margin-top: 10px;">
                <button type="submit">Đăng Ký</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('newsletter-form');
        const successMessage = document.getElementById('success-message');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const interestError = document.getElementById('interest-error');

        form.addEventListener('submit', function(event) {
            // Ngăn chặn hành động reload trang mặc định khi submit form
            event.preventDefault();

            let isValid = true;

            // Yêu cầu 2: Validate Email (phải có @ và domain)
            // Biểu thức chính quy (Regex) cơ bản để kiểm tra email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; 
            if (!emailRegex.test(emailInput.value)) {
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailError.style.display = 'none';
            }

            // Yêu cầu 2: Validate Interests (phải chọn ít nhất 1 checkbox)
            const checkedInterests = document.querySelectorAll('input[name="interest"]:checked');
            if (checkedInterests.length === 0) {
                interestError.style.display = 'block';
                isValid = false;
            } else {
                interestError.style.display = 'none';
            }

            // Yêu cầu 4: Hiển thị thông báo thành công nếu form hợp lệ
            if (isValid) {
                form.style.display = 'none'; // Ẩn form đi
                successMessage.style.display = 'block'; // Hiện thông báo thành công
            }
        });
    </script>

</body>
</html>
