<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 6: Bookstore Navigation</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
  }

  /* Nút Toggle Menu */
  .toggle-btn {
    padding: 10px 15px;
    font-size: 16px;
    cursor: pointer;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 5px;
    margin-bottom: 20px;
  }

  .toggle-btn:hover {
    background-color: #555;
  }

  /* Style cho thanh điều hướng */
  #nav-menu {
    list-style-type: none; /* Bỏ dấu chấm tròn mặc định của ul */
    padding: 0;
    margin: 0;
    display: flex; /* Hiển thị các thẻ li nằm ngang */
    align-items: center;
    background-color: #f4f4f4;
    padding: 15px;
    border-radius: 5px;
  }

  #nav-menu li a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
  }

  #nav-menu li a:hover {
    color: #007bff;
  }

  /* Yêu cầu 2: Thêm dấu chấm (•) giữa các navigation items */
  /* Sử dụng :not(:last-child) để không thêm dấu chấm vào sau phần tử cuối cùng */
  #nav-menu li:not(:last-child)::after {
    content: " • ";
    margin: 0 15px; /* Tạo khoảng cách hai bên dấu chấm */
    color: #666;
  }

  /* Yêu cầu 3: Class hidden để ẩn menu */
  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

  <button class="toggle-btn" onclick="toggleMenu()">Toggle Menu</button>

  <ul id="nav-menu">
    <li><a href="#">Home</a></li>
    <li><a href="#">Books &copy;</a></li>
    <li><a href="#">Authors &trade;</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

  <script>
    // Yêu cầu 3: Hàm toggleMenu()
    function toggleMenu() {
      // Lấy thẻ ul có id là nav-menu
      const menu = document.getElementById("nav-menu");
      
      // Sử dụng classList.toggle("hidden") để thêm/xóa class .hidden
      menu.classList.toggle("hidden");
    }
  </script>

</body>
</html>
