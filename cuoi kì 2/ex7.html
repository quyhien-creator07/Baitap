<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 7: Contact Form</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 50px;
    background-color: #f0f2f5;
  }

  /* Yêu cầu 3: Style form với spacing và borders */
  .contact-form {
    background: white;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #ddd;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }

  .form-group {
    margin-bottom: 20px; /* Spacing giữa các trường */
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc; /* Border cho các input */
    border-radius: 4px;
    box-sizing: border-box; /* Đảm bảo padding không làm tràn khung */
    font-size: 14px;
  }

  textarea {
    height: 100px;
    resize: vertical;
  }

  button {
    width: 100%;
    padding: 12px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
  }

  button:hover {
    background-color: #0056b3;
  }

  /* Style cho thông báo thành công */
  #success-message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    border-radius: 4px;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="contact-form">
    <h2 style="text-align: center; margin-top: 0;">Contact Us</h2>
    
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name..." required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your email..." required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write something..." required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <div id="success-message">
      ✓ Thank you! Your message has been sent successfully.
    </div>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const successMsg = document.getElementById('success-message');

    // Yêu cầu 4: Add basic validation
    form.addEventListener('submit', function(event) {
      // Ngăn form load lại trang
      event.preventDefault();

      // Lấy giá trị các trường
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      // Kiểm tra nếu các trường bị trống (Check if fields are empty)
      if (name === "" || email === "" || message === "") {
        alert("Please fill in all fields!");
        return;
      }

      // Nếu tất cả đã điền (Show success message)
      successMsg.style.display = 'block';
      
      // Xóa dữ liệu form sau khi gửi thành công
      form.reset();

      // Ẩn thông báo sau 5 giây (tùy chọn thêm cho đẹp)
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 5000);
    });
  </script>

</body>
</html>
