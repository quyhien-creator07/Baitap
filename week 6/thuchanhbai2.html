<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Create product list with CSS3</title>
   <link rel="stylesheet" href="css2.css">
</head>
<body>

    <h2>3. Create product list with CSS3</h2>
    
    <div class="product-list-container clearfix">
        
        <div class="Product">
            <img src="/week 6/rose.jpg" alt="Rose">
            <div class="ProductDetails">
                <span class="ProductName">Rose</span>
                <span class="ProductPrice">1.5$</span>
            </div>
        </div>
        
        <div class="Product">
            <img src="/week 6/tulip.jpg" alt="Tulip">
            <div class="ProductDetails">
                <span class="ProductName">Tulip</span>
                <span class="ProductPrice">2.0$</span>
            </div>
        </div>
        
        <div class="Product">
            <img src="/week 6/daisy.jpg" alt="Flower 3">
            <div class="ProductDetails">
                <span class="ProductName">Daisy</span>
                <span class="ProductPrice">1.8$</span>
            </div>
        </div>
        
    </div>
    
    <p class="figure-caption">Figure 7.3</p>
    
</body>
</html>
