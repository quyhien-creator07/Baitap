<!DOCTYPE html>

<head>

    <title>Simple Website</title>
    <style>
      
        body {
            margin: 0;
            padding: 0;
            background-color: #d3d3d3; 
            font-family: 'Times New Roman', Times, serif; 
        }
        
        .navbar {
            background-color: #333333; 
            text-align: center; 
            padding: 20px 0; 
            overflow: hidden;
        }

      
        .navbar a {
            display: inline-block;
            color: white; 
            text-decoration: none; 
            font-size: 20px; 
            margin: 0 15px; 
            font-weight: bold;
        }

       
        .navbar a:hover {
             text-decoration:  underline ;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Tutorials</a>

    </div>

</body>
